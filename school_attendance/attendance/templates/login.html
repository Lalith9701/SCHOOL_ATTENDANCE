<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Background image of a rural government school */
      background: linear-gradient(rgba(255,255,255,0.6), rgba(255,255,255,0.6)), 
                  url('https://images.unsplash.com/photo-1593642634443-44adaa06623a?fit=crop&w=1350&q=80'); 
      background-size: cover;
      background-position: center;
      color: #333;
    }
    nav {
      position: absolute;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(6px);
      padding: 10px 0;
    }
    nav a {
      color: #333;
      margin: 0 15px;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }
    nav a:hover { color: #6a11cb; } /* soft purple accent */
    .login-container {
      background: rgba(255,255,255,0.9);
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }
    .login-container h2 { 
      margin-bottom: 20px; 
      font-weight: 600; 
      color: #4b4b4b;
    }
    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
    }
    input:focus {
      border-color: #6a11cb;
      box-shadow: 0 0 6px rgba(106,17,203,0.2);
    }
    button {
      padding: 12px;
      width: 100%;
      border: none;
      background: #6a11cb; /* soft purple button */
      color: #fff;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    button:hover { 
      transform: scale(1.05); 
      background: #2575fc; /* soft blue hover */
    }
    .error {
      color: #ff4b5c;
      margin-top: 10px;
      font-size: 14px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
 
  <div class="login-container">
    <h2>Teacher Login</h2>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <div class="error" id="error"></div>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error');

      try {
        const response = await fetch('/api/token/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('access_token', data.access);
          localStorage.setItem('refresh_token', data.refresh);
          errorDiv.innerText = '';
          window.location.href = "/api/attendance/";
        } else {
          errorDiv.innerText = data.detail || 'Login failed!';
        }
      } catch (err) {
        errorDiv.innerText = "Server error!";
      }
    }
  </script>
</body>
</html>
